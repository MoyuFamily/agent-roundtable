name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/windows-validation]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-2025
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"
          npm ci

      - name: Ruff check
        run: python -m ruff check src tests scripts/check_mcp_runtime.py

      - name: Ruff format
        run: python -m ruff format --check src tests scripts/check_mcp_runtime.py

      - name: Mypy
        run: python -m mypy src

      - name: Node syntax check
        run: npm run check

      - name: Configure PDF test browser
        if: runner.os == 'Linux'
        run: |
          echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "ROUNDTABLE_REQUIRE_PDF=1" >> "$GITHUB_ENV"
          echo "ROUNDTABLE_PDF_NO_SANDBOX=1" >> "$GITHUB_ENV"

      - name: Configure Windows PDF test browser
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (!(Test-Path $chrome)) { throw 'Chrome is not installed' }
          "PUPPETEER_EXECUTABLE_PATH=$chrome" >> $env:GITHUB_ENV
          "ROUNDTABLE_REQUIRE_PDF=1" >> $env:GITHUB_ENV

      - name: Pytest
        run: python -m pytest -q

  package:
    name: Build & Wheel Smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and verify
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          python -m venv /tmp/roundtable-smoke
          /tmp/roundtable-smoke/bin/python -m pip install --upgrade pip
          /tmp/roundtable-smoke/bin/python -m pip install dist/*.whl
          /tmp/roundtable-smoke/bin/python - <<'PY'
          from importlib import resources
          import roundtable

          assert roundtable.__version__ == "2.1.0"
          assert (resources.files("roundtable") / "web" / "viewer.js").is_file()
          assert (resources.files("roundtable") / "web" / "i18n.js").is_file()
          assert (resources.files("roundtable") / "web" / "pdf-worker.mjs").is_file()
          assert (resources.files("roundtable") / "templates" / "product-review.json").is_file()
          assert (resources.files("roundtable") / "skills" / "mcp-roundtable" / "SKILL.md").is_file()
          PY
          /tmp/roundtable-smoke/bin/python -m roundtable.demo --no-web --rounds 1
          for wheel_artifact in dist/*.whl; do
            /tmp/roundtable-smoke/bin/python -m pip install "${wheel_artifact}[mcp]"
          done
          /tmp/roundtable-smoke/bin/python scripts/check_mcp_runtime.py --transport stdio
          /tmp/roundtable-smoke/bin/python scripts/check_mcp_runtime.py --transport sse
