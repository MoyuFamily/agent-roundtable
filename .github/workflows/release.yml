name: Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  # ─── Run Tests (gate before any publishing) ─────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ --ignore=tests/test_web_viewer.py -q

  # ─── Build Python Package ───────────────────────────────────────────
  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  # ─── Publish to PyPI ────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Using API token. To switch to Trusted Publishing, remove the
          # `password:` line below and configure it in PyPI project settings.
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ─── Publish to ClawHub ─────────────────────────────────────────────
  publish-clawhub:
    name: Publish to ClawHub
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Configure ClawHub auth
        run: |
          mkdir -p ~/.config/clawhub
          echo '{"registry":"https://clawhub.ai","token":"${{ secrets.CLAWHUB_TOKEN }}"}' > ~/.config/clawhub/config.json

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish to ClawHub
        run: |
          clawhub publish . \
            --slug agent-roundtable \
            --version ${{ steps.version.outputs.VERSION }}

  # ─── Sync to Hermes Skill Hub ───────────────────────────────────────
  publish-hermes-skill-hub:
    name: Sync to Hermes Skill Hub
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync SKILL.md to pointer repo
        env:
          # PAT with `repo` scope on MoyuFamily/hermes-skill-agent-roundtable.
          # The default GITHUB_TOKEN is scoped to this repo only and cannot
          # push to the pointer repo.
          GITHUB_TOKEN: ${{ secrets.HERMES_SKILL_HUB_TOKEN }}
        run: |
          SKILL_REPO="MoyuFamily/hermes-skill-agent-roundtable"
          TMPDIR=$(mktemp -d)

          # Clone or create pointer repo
          gh repo clone "$SKILL_REPO" "$TMPDIR" 2>/dev/null || {
            gh repo create "$SKILL_REPO" --public --description "Hermes Skill Hub pointer: agent-roundtable"
            gh repo clone "$SKILL_REPO" "$TMPDIR"
          }

          # Copy and commit
          cp SKILL.md "$TMPDIR/SKILL.md"
          cd "$TMPDIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SKILL.md
          git commit -m "chore: update SKILL.md to ${{ github.ref_name }}" || echo "No changes"
          git push origin main

  # ─── GitHub Release ─────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [publish-pypi, publish-clawhub]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV=$(git tag --sort=-creatordate | head -2 | tail -1)
          echo "TAG=$PREV" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          # Extract changelog section for this version
          VERSION="${GITHUB_REF_NAME#v}"
          # Escape regex metacharacters in version (dots) for safe matching
          ESC_VERSION=$(echo "$VERSION" | sed 's/\./\\./g')
          NOTES=$(awk "/^## \\[$ESC_VERSION/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ github.ref_name }}"
          fi
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          generate_release_notes: true
