[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roundtable"
version = "0.1.0"
description = "Framework-agnostic multi-agent roundtable discussion library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

# Zero external dependencies — only stdlib
dependencies = []

[project.optional-dependencies]
hermes = []  # Hermes adapter auto-discovers if hermes-agent is installed
web = [
    "nanoid>=2.0",  # Token generation (falls back to secrets.token_urlsafe)
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"roundtable" = ["web/*.html", "web/*.css", "web/*.mjs", "web/*.cjs", "web/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "RUF001",  # ambiguous unicode in Chinese strings (fullwidth punctuation)
]

[tool.ruff.lint.isort]
known-first-party = ["roundtable"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "tools.registry",
    "hermes_cli.config",
    "hermes_cli.*",
    "tools.*",
]
ignore_missing_imports = true
