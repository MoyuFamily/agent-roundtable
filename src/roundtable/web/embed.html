<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圆桌讨论 — Roundtable Embed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/viewer.css">
  <style>
    /* Embed-specific overrides — compact chrome optimized for iframe contexts */
    body { background: var(--rt-bg-body); }
    .embed-header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 8px 14px;
      background: var(--rt-bg-card);
      border-bottom: 1px solid var(--rt-border);
      font-size: 13px;
    }
    .embed-header .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .embed-header .topic {
      font-weight: 600; color: var(--rt-text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .embed-header .open-link {
      color: var(--rt-text-muted); text-decoration: none;
      padding: 4px 10px; border-radius: 8px;
      border: 1px solid var(--rt-border);
      transition: all .15s;
      font-size: 12px;
      flex-shrink: 0;
    }
    .embed-header .open-link:hover {
      color: var(--rt-text-primary);
      background: var(--rt-bg-body);
      border-color: var(--rt-text-muted);
    }
    .embed-main { padding: 12px 14px 24px; }
    /* Hide elements that exist for viewer.js compatibility but aren't shown in embed */
    .embed-shim { display: none !important; }
  </style>
</head>
<body class="embed-mode">
  <!-- Compact embed header: topic title + status + "open in new tab" -->
  <header class="embed-header">
    <div class="left">
      <span class="status-badge waiting" id="statusBadge">
        <span class="badge-dot"></span>
        <span id="statusLabel" data-i18n="statusWaiting">等待中</span>
      </span>
      <span class="topic" id="topicTitle" data-i18n="pageTitle">圆桌讨论</span>
    </div>
    <a class="open-link" id="openInTabLink" target="_blank" rel="noopener" data-i18n="embedOpenFull">在新页面查看 ↗</a>
  </header>

  <!-- Main content -->
  <main class="embed-main" id="mainContent">
    <!-- Waiting state -->
    <div id="waitingState" class="flex flex-col items-center justify-center py-16">
      <div class="spinner mb-3"></div>
      <p class="text-sm" style="color: var(--rt-text-secondary)" data-i18n="waitingTitle">讨论即将开始…</p>
    </div>

    <!-- Active state -->
    <div id="activeState" class="hidden">
      <div id="participantsBar" class="flex gap-2 mb-3 overflow-x-auto pb-2"></div>
      <div id="speechesContainer"></div>

      <div id="conclusionCard" class="hidden conclusion-card mt-5">
        <h3 class="text-base font-semibold mb-2" style="position:relative;z-index:1;color:var(--rt-text-primary)" data-i18n="conclusion">📌 讨论结论</h3>
        <div id="conclusionContent" class="leading-relaxed" style="position:relative;z-index:1;color:var(--rt-text-secondary)"></div>
      </div>
    </div>

    <!-- Revoked state -->
    <div id="revokedState" class="revoked-page hidden">
      <div class="revoked-icon-lg">🔒</div>
      <h2 class="revoked-title" data-i18n="revokedTitle">此讨论链接已失效</h2>
      <p class="revoked-desc" data-i18n="revokedDesc">创作者已撤销了此链接的访问权限</p>
    </div>
  </main>

  <!-- Hidden shims so viewer.js DOM lookups (which may use these refs unconditionally elsewhere) don't crash -->
  <div class="embed-shim">
    <span id="connDot"></span>
    <span id="connText"></span>
    <button id="scrollBottomBtn"></button>
    <div id="participantsTrigger"></div>
    <span id="triggerAvatars"></span>
    <span id="triggerCount"></span>
    <div id="participantsDrawerOverlay"></div>
    <div id="participantsDrawer"></div>
    <div id="drawerParticipantList"></div>
    <div id="replayEntry"></div>
    <div id="replayEntryMeta"></div>
    <div id="replayEntryAgents"></div>
    <div id="replayView"></div>
  </div>

  <script src="/i18n.js"></script>
  <script src="/viewer.js" defer></script>
  <script>
    // Set "open in new tab" link target before viewer.js runs.
    (function() {
      var cfg = window.__RT_CONFIG__ || {};
      var token = cfg.token || '';
      if (!token) return;
      var link = document.getElementById('openInTabLink');
      if (link) link.href = '/r/' + encodeURIComponent(token);
    })();
  </script>
</body>
</html>
