<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圆桌讨论 — Roundtable</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--rt-font-sans); background: var(--rt-bg-body); color: var(--rt-text-primary); min-height: 100vh; }

    /* Status indicator */
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-dot.waiting { background: var(--rt-brand); animation: pulse 2s infinite; }
    .status-dot.active { background: var(--rt-error); animation: pulse 1.5s infinite; }
    .status-dot.concluded { background: var(--rt-success); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.2); }
    }

    /* Speech card */
    .speech-card {
      background: var(--rt-bg-card);
      border: 1px solid var(--rt-border);
      border-radius: var(--rt-radius-lg);
      padding: var(--rt-space-4) var(--rt-space-5);
      margin-bottom: var(--rt-space-4);
      box-shadow: var(--rt-shadow-sm);
      transition: all var(--rt-duration-normal);
    }
    .speech-card:hover { box-shadow: var(--rt-shadow-md); }

    /* New speech animation */
    .speech-card.new {
      animation: fadeSlideIn 0.5s ease-out;
    }
    .speech-card.highlight {
      border-left: 3px solid var(--rt-brand);
      box-shadow: -4px 0 12px var(--rt-brand-glow), var(--rt-shadow-sm);
    }

    :root {
      --rt-role-product-rgb: 59, 130, 246;
      --rt-role-design-rgb: 168, 85, 247;
      --rt-role-engineer-rgb: 34, 197, 94;
      --rt-role-research-rgb: 245, 158, 11;
      --rt-role-marketing-rgb: 236, 72, 153;
      --rt-role-default-rgb: 100, 116, 139;
      --rt-role-coordinator-rgb: 234, 179, 8;
      --rt-role-coordinator: #EAB308;
      --rt-role-coordinator-bg: rgba(234, 179, 8, 0.15);
    }

    /* Distinct Speech Cards by Role */
    .speech-card.role-coordinator {
      border-left: 4px solid var(--rt-role-coordinator);
      background: linear-gradient(135deg, rgba(var(--rt-role-coordinator-rgb), 0.06) 0%, var(--rt-bg-card) 100%);
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.05), var(--rt-shadow-sm);
    }
    .speech-card.role-product {
      border-left: 4px solid var(--rt-role-product);
      background: linear-gradient(135deg, rgba(var(--rt-role-product-rgb), 0.04) 0%, var(--rt-bg-card) 100%);
    }
    .speech-card.role-design {
      border-left: 4px solid var(--rt-role-design);
      background: linear-gradient(135deg, rgba(var(--rt-role-design-rgb), 0.04) 0%, var(--rt-bg-card) 100%);
    }
    .speech-card.role-engineer {
      border-left: 4px solid var(--rt-role-engineer);
      background: linear-gradient(135deg, rgba(var(--rt-role-engineer-rgb), 0.04) 0%, var(--rt-bg-card) 100%);
    }
    .speech-card.role-research {
      border-left: 4px solid var(--rt-role-research);
      background: linear-gradient(135deg, rgba(var(--rt-role-research-rgb), 0.04) 0%, var(--rt-bg-card) 100%);
    }
    .speech-card.role-marketing {
      border-left: 4px solid var(--rt-role-marketing);
      background: linear-gradient(135deg, rgba(var(--rt-role-marketing-rgb), 0.04) 0%, var(--rt-bg-card) 100%);
    }
    .speech-card.role-default {
      border-left: 4px solid var(--rt-role-default);
      background: linear-gradient(135deg, rgba(var(--rt-role-default-rgb), 0.04) 0%, var(--rt-bg-card) 100%);
    }

    /* Round Section Aggregation */
    .round-section {
      border: 1px solid var(--rt-border);
      border-radius: var(--rt-radius-lg);
      background: rgba(30, 41, 59, 0.2);
      margin-bottom: var(--rt-space-5);
      overflow: hidden;
      box-shadow: var(--rt-shadow-sm);
      transition: all var(--rt-duration-normal);
    }
    .round-section:hover {
      box-shadow: var(--rt-shadow-md);
      border-color: var(--rt-border-light);
    }
    .round-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--rt-space-3) var(--rt-space-4);
      background: rgba(79, 70, 229, 0.04);
      border-bottom: 1px solid var(--rt-border);
      cursor: pointer;
      user-select: none;
      transition: background var(--rt-duration-fast);
    }
    .round-header:hover {
      background: rgba(79, 70, 229, 0.08);
    }
    .round-title {
      font-size: var(--rt-font-size-sm);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--rt-brand-light);
      display: flex;
      align-items: center;
      gap: var(--rt-space-2);
    }
    .round-badge-count {
      font-size: var(--rt-font-size-xs);
      font-weight: 500;
      color: var(--rt-text-secondary);
      background: var(--rt-border);
      padding: 2px 8px;
      border-radius: var(--rt-radius-full);
    }
    .round-body {
      padding: var(--rt-space-4);
      display: flex;
      flex-direction: column;
      gap: var(--rt-space-4);
    }
    .round-section.collapsed .round-body {
      display: none;
    }
    .round-section.collapsed .round-header {
      border-bottom-color: transparent;
    }
    .round-section .toggle-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      color: var(--rt-text-muted);
      transition: transform var(--rt-duration-normal);
    }
    .round-section.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }

    /* Markdown styling inside cards and conclusion */
    .markdown-content p { margin-bottom: var(--rt-space-2); }
    .markdown-content p:last-child { margin-bottom: 0; }
    .markdown-content ul, .markdown-content ol { margin-bottom: var(--rt-space-2); padding-left: var(--rt-space-5); }
    .markdown-content ul { list-style-type: disc; }
    .markdown-content ol { list-style-type: decimal; }
    .markdown-content li { margin-bottom: var(--rt-space-1); }
    .markdown-content pre {
      background: var(--rt-bg-code);
      border: 1px solid var(--rt-border);
      border-radius: var(--rt-radius-sm);
      padding: var(--rt-space-3);
      overflow-x: auto;
      margin-bottom: var(--rt-space-3);
      font-family: var(--rt-font-mono);
      font-size: var(--rt-font-size-xs);
      color: var(--rt-text-primary);
    }
    .markdown-content code {
      font-family: var(--rt-font-mono);
      background: var(--rt-bg-code);
      padding: 2px 4px;
      border-radius: var(--rt-radius-sm);
      font-size: 90%;
      color: var(--rt-brand-light);
    }
    .markdown-content pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      color: inherit;
      font-size: inherit;
    }
    .markdown-content h1, .markdown-content h2, .markdown-content h3, .markdown-content h4 {
      color: var(--rt-text-primary);
      font-weight: 600;
      margin-top: var(--rt-space-4);
      margin-bottom: var(--rt-space-2);
    }
    .markdown-content h1 { font-size: 1.3em; border-bottom: 1px solid var(--rt-border); padding-bottom: var(--rt-space-1); }
    .markdown-content h2 { font-size: 1.15em; }
    .markdown-content h3 { font-size: 1.05em; }
    .markdown-content blockquote {
      border-left: 4px solid var(--rt-brand);
      padding-left: var(--rt-space-3);
      color: var(--rt-text-muted);
      margin-bottom: var(--rt-space-2);
      font-style: italic;
    }
    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: var(--rt-space-3);
      font-size: var(--rt-font-size-sm);
    }
    .markdown-content th, .markdown-content td {
      border: 1px solid var(--rt-border);
      padding: var(--rt-space-2);
      text-align: left;
    }
    .markdown-content th {
      background: rgba(255, 255, 255, 0.05);
      color: var(--rt-text-primary);
      font-weight: 600;
    }

    .speech-card.streaming {
      border-left-color: var(--rt-brand);
      box-shadow: 0 0 14px var(--rt-brand-glow), var(--rt-shadow-sm);
    }
    .speech-card.streaming .stream-cursor::after {
      content: "▊";
      color: var(--rt-text-muted);
      animation: cursorBlink 0.8s step-end infinite;
      margin-left: 2px;
      opacity: 1;
    }
    /* 发言完成后光标淡出 */
    .speech-card:not(.streaming) .stream-cursor::after {
      animation: none;
      opacity: 0;
      transition: opacity 200ms ease-out;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .viewpoints-card {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.08), rgba(30, 41, 59, 0.35));
      border: 1px solid var(--rt-border-light);
      border-radius: var(--rt-radius-lg);
      padding: var(--rt-space-4);
      margin: var(--rt-space-3) 0 var(--rt-space-4);
      box-shadow: var(--rt-shadow-sm);
      animation: fadeSlideIn 0.35s ease-out;
      transition: box-shadow var(--rt-duration-normal);
    }
    .viewpoints-card:hover {
      box-shadow: var(--rt-shadow-md);
    }
    .viewpoints-card.collapsed .viewpoints-grid {
      display: none;
    }
    .viewpoints-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--rt-space-2);
      margin-bottom: var(--rt-space-3);
      color: var(--rt-text-primary);
      font-weight: 700;
      font-size: var(--rt-font-size-sm);
      cursor: pointer;
      user-select: none;
    }
    .viewpoints-card.collapsed .viewpoints-title {
      margin-bottom: 0;
    }
    .viewpoints-title .toggle-icon {
      display: inline-block;
      transition: transform var(--rt-duration-normal);
    }
    .viewpoints-card.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }
    /* 发言完成标记 ✓ */
    .speech-checkmark {
      display: inline-block;
      color: var(--rt-semantic-success, #22c55e);
      font-size: 12px;
      margin-left: 6px;
      opacity: 0;
      animation: checkFadeIn 0.3s ease-out forwards;
    }
    @keyframes checkFadeIn {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }
    /* 最终总结发光效果 */
    .final-summary-glow {
      box-shadow: 0 0 20px rgba(79, 70, 229, 0.25), 0 0 40px rgba(79, 70, 229, 0.1);
      border-color: var(--rt-brand);
      animation: glowPulse 2s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(79, 70, 229, 0.25), 0 0 40px rgba(79, 70, 229, 0.1); }
      50% { box-shadow: 0 0 30px rgba(79, 70, 229, 0.35), 0 0 60px rgba(79, 70, 229, 0.15); }
    }
    /* Auto-scroll "回到最新" button (PRD F1.5) */
    .scroll-to-bottom-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      background: rgba(59,130,246,0.9);
      color: white;
      border: none;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .scroll-to-bottom-btn:hover {
      background: rgba(59,130,246,1);
      box-shadow: 0 6px 20px rgba(59,130,246,0.4);
      transform: translateX(-50%) translateY(-2px);
    }
    .viewpoints-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--rt-space-3);
    }
    @media (min-width: 720px) {
      .viewpoints-grid { grid-template-columns: 1fr 1fr; }
    }
    .viewpoints-column {
      background: rgba(15, 23, 42, 0.35);
      border: 1px solid var(--rt-border);
      border-radius: var(--rt-radius-md);
      padding: var(--rt-space-3);
    }
    .viewpoints-column h4 {
      margin-bottom: var(--rt-space-2);
      font-size: var(--rt-font-size-xs);
      letter-spacing: 0.08em;
      color: var(--rt-text-secondary);
    }
    .viewpoints-column ul {
      display: flex;
      flex-direction: column;
      gap: var(--rt-space-2);
      list-style: none;
    }
    .viewpoint-item {
      color: var(--rt-text-secondary);
      font-size: var(--rt-font-size-sm);
      line-height: 1.55;
      padding-left: var(--rt-space-3);
      border-left: 2px solid var(--rt-border-light);
    }
    .viewpoint-item.consensus { border-left-color: var(--rt-success); }
    .viewpoint-item.disagreement { border-left-color: var(--rt-warning); }
    .viewpoint-supporters {
      display: block;
      margin-top: 2px;
      color: var(--rt-text-muted);
      font-size: var(--rt-font-size-xs);
    }

    /* Status badge in header */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-badge .badge-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-badge.live {
      background: var(--rt-error-bg);
      color: var(--rt-error);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .status-badge.live .badge-dot {
      background: var(--rt-error);
      animation: blink 1.5s ease-in-out infinite;
    }
    .status-badge.waiting {
      background: var(--rt-bg-badge);
      color: var(--rt-brand);
      border: 1px solid rgba(79, 70, 229, 0.3);
    }
    .status-badge.waiting .badge-dot {
      background: var(--rt-brand);
      animation: pulse 2s infinite;
    }
    .status-badge.ended {
      background: var(--rt-success-bg);
      color: var(--rt-success);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status-badge.ended .badge-dot {
      background: var(--rt-success);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Conclusion card */
    .conclusion-card {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.08), var(--rt-bg-card));
      border: 1.5px solid var(--rt-brand);
      border-radius: var(--rt-radius-lg);
      padding: var(--rt-space-6);
      box-shadow: 0 0 20px var(--rt-brand-glow), 0 0 60px rgba(79, 70, 229, 0.1);
      position: relative;
      overflow: hidden;
      animation: fadeSlideIn 0.6s ease-out, glow-pulse 3s ease-in-out infinite;
    }
    .conclusion-card::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: linear-gradient(135deg, var(--rt-brand), var(--rt-brand-light));
      opacity: 0.08;
      filter: blur(8px);
      z-index: 0;
    }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 20px var(--rt-brand-glow), 0 0 60px rgba(79, 70, 229, 0.1); }
      50% { box-shadow: 0 0 30px var(--rt-brand-glow-strong), 0 0 80px rgba(79, 70, 229, 0.15); }
    }

    /* Header */
    .header {
      background: var(--rt-bg-card);
      border-bottom: 1px solid var(--rt-border);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    /* Container */
    .container {
      max-width: 768px;
      margin: 0 auto;
      padding: var(--rt-space-4);
    }

    /* Revoked state */
    .revoked-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    /* Waiting spinner */
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--rt-border);
      border-top-color: var(--rt-brand);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Participant avatar */
    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(79, 70, 229, 0.15);
      color: var(--rt-brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* Round badge */
    .round-badge {
      background: rgba(79, 70, 229, 0.08);
      color: var(--rt-brand);
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--rt-radius-sm);
    }

    /* Connection status */
    .conn-status {
      font-size: 12px;
      color: var(--rt-text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .conn-dot { width: 6px; height: 6px; border-radius: 50%; }
    .conn-dot.connected { background: #10B981; }
    .conn-dot.disconnected { background: #EF4444; }
    .conn-dot.reconnecting { background: #F59E0B; animation: pulse 1s infinite; }

    /* ═══════════════════════════════════════
       Share Button
       ═══════════════════════════════════════ */
    .share-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--rt-bg-card);
      border: 1px solid var(--rt-border);
      border-radius: var(--rt-radius-sm);
      color: var(--rt-text-secondary);
      font-size: var(--rt-font-size-sm);
      cursor: pointer;
      transition: all 200ms ease-out;
      white-space: nowrap;
    }
    .share-btn:hover {
      border-color: var(--rt-brand);
      color: var(--rt-brand);
      background: var(--rt-bg-badge);
    }
    .share-btn svg { width: 16px; height: 16px; }

    /* ═══════════════════════════════════════
       Popover (Desktop)
       ═══════════════════════════════════════ */
    .share-popover {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 360px;
      background: var(--rt-bg-card);
      border: 1px solid var(--rt-border);
      border-radius: var(--rt-radius-lg);
      box-shadow: var(--rt-shadow-lg);
      padding: var(--rt-space-5);
      z-index: 50;
      transform-origin: top right;
      opacity: 0;
      transform: scale(0.95) translateY(-4px);
      pointer-events: none;
      transition: opacity 200ms ease-out, transform 200ms ease-out;
    }
    .share-popover.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }
    .share-popover-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--rt-font-size-sm);
      font-weight: 600;
      color: var(--rt-text-primary);
      margin-bottom: var(--rt-space-3);
    }
    .share-link-row {
      display: flex;
      gap: 8px;
      margin-bottom: var(--rt-space-3);
    }
    .share-link-input {
      flex: 1;
      background: var(--rt-bg-input);
      border: 1px solid var(--rt-border);
      border-radius: var(--rt-radius-sm);
      padding: 8px 12px;
      color: var(--rt-text-primary);
      font-size: var(--rt-font-size-xs);
      font-family: var(--rt-font-mono);
      outline: none;
      min-width: 0;
      text-overflow: ellipsis;
    }
    .share-link-input:focus {
      border-color: var(--rt-brand);
    }
    .copy-btn {
      padding: 8px 16px;
      background: var(--rt-brand);
      color: #fff;
      border: none;
      border-radius: var(--rt-radius-sm);
      font-size: var(--rt-font-size-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 200ms ease-out;
      white-space: nowrap;
    }
    .copy-btn:hover { background: var(--rt-brand-hover); }
    .copy-btn.copied {
      background: var(--rt-success);
    }
    .share-hint {
      font-size: var(--rt-font-size-xs);
      color: var(--rt-text-muted);
      margin-bottom: var(--rt-space-3);
    }
    .revoke-link-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      background: none;
      border: none;
      border-top: 1px solid var(--rt-border);
      padding-top: var(--rt-space-3);
      color: var(--rt-warning);
      font-size: var(--rt-font-size-xs);
      cursor: pointer;
      transition: color 200ms ease-out;
      width: 100%;
    }
    .revoke-link-btn:hover { color: var(--rt-error); }

    /* ═══════════════════════════════════════
       Bottom Sheet (Mobile)
       ═══════════════════════════════════════ */
    .share-sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease-out;
    }
    .share-sheet-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .share-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--rt-bg-card);
      border-top-left-radius: var(--rt-radius-lg);
      border-top-right-radius: var(--rt-radius-lg);
      padding: var(--rt-space-4) var(--rt-space-5) var(--rt-space-6);
      max-height: 60vh;
      z-index: 61;
      transform: translateY(100%);
      transition: transform 200ms ease-out;
    }
    .share-sheet.visible {
      transform: translateY(0);
    }
    .share-sheet-handle {
      width: 40px;
      height: 4px;
      background: var(--rt-border);
      border-radius: 2px;
      margin: 0 auto var(--rt-space-4);
    }
    .share-sheet .share-popover-title { margin-bottom: var(--rt-space-4); }
    .share-sheet .share-link-input {
      width: 100%;
      margin-bottom: var(--rt-space-3);
    }
    .share-sheet .copy-btn {
      width: 100%;
      padding: 12px;
      font-size: var(--rt-font-size-base);
      margin-bottom: var(--rt-space-3);
    }
    .share-sheet .share-hint { margin-bottom: var(--rt-space-4); }
    .share-sheet .revoke-link-btn {
      justify-content: center;
      padding-top: var(--rt-space-4);
    }

    /* ═══════════════════════════════════════
       Revoke Confirmation Modal
       ═══════════════════════════════════════ */
    .revoke-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease-out;
    }
    .revoke-modal-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .revoke-modal {
      background: var(--rt-bg-card);
      border-radius: var(--rt-radius-lg);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      padding: var(--rt-space-6);
      max-width: 380px;
      width: calc(100% - 32px);
      text-align: center;
      transform: scale(0.95);
      transition: transform 200ms ease-out;
    }
    .revoke-modal-overlay.visible .revoke-modal {
      transform: scale(1);
    }
    .revoke-modal-icon {
      font-size: 40px;
      margin-bottom: var(--rt-space-3);
    }
    .revoke-modal-title {
      font-size: var(--rt-font-size-lg);
      font-weight: 700;
      color: var(--rt-text-primary);
      margin-bottom: var(--rt-space-2);
    }
    .revoke-modal-desc {
      font-size: var(--rt-font-size-sm);
      color: var(--rt-text-muted);
      margin-bottom: var(--rt-space-6);
      line-height: 1.5;
    }
    .revoke-modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      padding-top: var(--rt-space-6);
      border-top: 1px solid var(--rt-border);
    }
    .revoke-cancel-btn {
      padding: 0 20px;
      height: 40px;
      background: transparent;
      border: 1px solid var(--rt-border);
      border-radius: 8px;
      color: var(--rt-text-secondary);
      font-size: var(--rt-font-size-sm);
      cursor: pointer;
      transition: all 200ms ease-out;
    }
    .revoke-cancel-btn:hover { border-color: var(--rt-text-muted); }
    .revoke-confirm-btn {
      padding: 0 20px;
      height: 40px;
      background: #EF4444;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: var(--rt-font-size-sm);
      font-weight: 600;
      cursor: pointer;
      transition: background 200ms ease-out;
    }
    .revoke-confirm-btn:hover { background: #DC2626; }

    /* Revoked state inside share panel */
    .share-revoked-state {
      text-align: center;
      padding: var(--rt-space-4) 0;
      color: var(--rt-text-muted);
      font-size: var(--rt-font-size-sm);
    }
    .share-revoked-state .revoked-icon { font-size: 28px; margin-bottom: 8px; }

    /* ═══════════════════════════════════════
       Revoked Full Page (dark theme)
       ═══════════════════════════════════════ */
    .revoked-page {
      position: fixed;
      inset: 0;
      background: var(--rt-bg-body);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      text-align: center;
      padding: var(--rt-space-5);
    }
    .revoked-page .revoked-icon-lg {
      font-size: 48px;
      color: var(--rt-text-muted);
      margin-bottom: var(--rt-space-4);
    }
    .revoked-page .revoked-title {
      font-size: var(--rt-font-size-xl);
      font-weight: 700;
      color: var(--rt-text-primary);
      margin-bottom: var(--rt-space-2);
    }
    .revoked-page .revoked-desc {
      font-size: var(--rt-font-size-base);
      color: var(--rt-text-muted);
      margin-bottom: var(--rt-space-10);
    }
    .revoked-page .revoked-brand {
      font-size: var(--rt-font-size-xs);
      color: var(--rt-text-disabled);
    }

    /* Mobile: share button at bottom */
    .mobile-share-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--rt-bg-card);
      border-top: 1px solid var(--rt-border);
      padding: var(--rt-space-3) var(--rt-space-4);
      z-index: 20;
    }
    .mobile-share-bar .share-btn {
      width: 100%;
      justify-content: center;
      padding: 10px;
    }

    @media (max-width: 768px) {
      .header .share-btn { display: none; }
      .mobile-share-bar { display: block; }
      main { padding-bottom: 72px; }
    }

    /* ═══════════════════════════════════════
       收敛度进度条
       ═══════════════════════════════════════ */
    .convergence-bar {
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      margin: 8px 0;
      overflow: hidden;
    }
    .convergence-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--rt-success), var(--rt-warning));
      transition: width 0.8s ease-out;
    }
    .convergence-label {
      font-size: 12px;
      color: var(--rt-text-muted);
      text-align: right;
      margin-top: 2px;
    }

    /* ═══════════════════════════════════════
       观点卡片模式切换（精简/全文）
       ═══════════════════════════════════════ */
    .mode-toggle {
      display: inline-flex;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }
    .mode-toggle-btn {
      padding: 4px 12px;
      font-size: 12px;
      color: var(--rt-text-muted);
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      background: transparent;
    }
    .mode-toggle-btn.active {
      background: var(--rt-brand);
      color: #fff;
    }

    /* ═══════════════════════════════════════
       结论区（verdict box）
       ═══════════════════════════════════════ */
    .verdict-box {
      background: rgba(79, 70, 229, 0.1);
      border: 1px solid rgba(79, 70, 229, 0.3);
      border-radius: var(--rt-radius-md);
      padding: 16px 20px;
      margin-bottom: var(--rt-space-4);
      font-size: var(--rt-font-size-lg);
      font-weight: 600;
      color: var(--rt-text-primary);
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .verdict-box .verdict-icon {
      font-size: 18px;
      flex-shrink: 0;
      line-height: 1.5;
    }

    /* ═══════════════════════════════════════
       ↓ 新消息 浮动按钮
       ═══════════════════════════════════════ */
    .scroll-bottom-btn {
      position: fixed;
      bottom: 80px;
      right: 24px;
      background: var(--rt-bg-card);
      border: 1px solid var(--rt-border);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: var(--rt-font-size-sm);
      color: var(--rt-text-secondary);
      cursor: pointer;
      box-shadow: var(--rt-shadow-md);
      transition: opacity 0.2s, transform 0.2s;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .scroll-bottom-btn:hover {
      background: var(--rt-bg-card-hover);
      border-color: var(--rt-brand);
      color: var(--rt-brand);
    }
    .scroll-bottom-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }

    /* ═══════════════════════════════════════
       发言流式 agent 辉光（按角色色）
       ═══════════════════════════════════════ */
    .speech-card.streaming.role-product { box-shadow: -4px 0 16px rgba(59, 130, 246, 0.15), var(--rt-shadow-sm); }
    .speech-card.streaming.role-design { box-shadow: -4px 0 16px rgba(168, 85, 247, 0.15), var(--rt-shadow-sm); }
    .speech-card.streaming.role-engineer { box-shadow: -4px 0 16px rgba(34, 197, 94, 0.15), var(--rt-shadow-sm); }
    .speech-card.streaming.role-research { box-shadow: -4px 0 16px rgba(245, 158, 11, 0.15), var(--rt-shadow-sm); }
    .speech-card.streaming.role-marketing { box-shadow: -4px 0 16px rgba(236, 72, 153, 0.15), var(--rt-shadow-sm); }
    .speech-card.streaming.role-coordinator { box-shadow: -4px 0 16px rgba(234, 179, 8, 0.15), var(--rt-shadow-sm); }
    .speech-card.streaming.role-default { box-shadow: -4px 0 16px rgba(100, 116, 139, 0.15), var(--rt-shadow-sm); }

    /* ═══════════════════════════════════════
       观点卡片：精简/全文模式内容截断
       ═══════════════════════════════════════ */
    .viewpoints-body[data-mode="compact"] .viewpoints-column ul li {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .viewpoints-body[data-mode="full"] .viewpoints-column ul li {
      display: block;
      -webkit-line-clamp: unset;
      overflow: visible;
    }

    /* Reduced motion accessibility */
    @media (prefers-reduced-motion: reduce) {
      .status-badge .badge-dot,
      .conn-dot.reconnecting,
      .spinner {
        animation: none !important;
      }
      .speech-card.new { animation: none !important; }
      .conclusion-card { animation: none !important; }
    }
  </style>

  <!-- Replay Mode Styles -->
  <style>
    :root {
      --rt-replay-bg: #0D1525;
      --rt-replay-accent: #6366F1;
      --rt-replay-accent-glow: rgba(99, 102, 241, 0.2);
      --rt-replay-progress-track: rgba(255, 255, 255, 0.08);
      --rt-replay-progress-fill: #6366F1;
      --rt-control-height: 72px;
      --rt-control-bg: rgba(15, 23, 42, 0.92);
      --rt-control-border: rgba(255, 255, 255, 0.08);
    }

    /* Replay entry card */
    .replay-entry {
      background: rgba(99, 102, 241, 0.08);
      border: 1.5px dashed var(--rt-replay-accent);
      border-radius: var(--rt-radius-lg, 16px);
      padding: 24px;
      margin-top: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .replay-entry:hover {
      border-style: solid;
      background: rgba(99, 102, 241, 0.14);
      box-shadow: 0 0 20px var(--rt-replay-accent-glow);
    }
    .replay-entry-icon { font-size: 32px; margin-bottom: 8px; }
    .replay-entry-title { font-size: 18px; font-weight: 600; color: var(--rt-text-primary); }
    .replay-entry-meta { font-size: 13px; color: var(--rt-text-muted); margin-top: 4px; }
    .replay-entry-agents { display: flex; justify-content: center; gap: -8px; margin-top: 12px; }
    .replay-entry-agents .agent-chip {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--rt-replay-bg);
      display: flex; align-items: center; justify-content: center; font-size: 14px;
      margin-left: -6px; background: var(--rt-bg-card);
    }
    .replay-entry-agents .agent-chip:first-child { margin-left: 0; }

    /* Replay view container */
    #replayView {
      position: fixed; inset: 0; z-index: 100;
      background: var(--rt-replay-bg);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    #replayView.hidden { display: none; }

    /* Replay top bar */
    .replay-top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--rt-border);
      flex-shrink: 0;
    }
    .replay-back-btn {
      display: flex; align-items: center; gap: 6px;
      background: none; border: none; color: var(--rt-text-secondary);
      font-size: 14px; cursor: pointer; padding: 6px 10px; border-radius: 8px;
      transition: all 0.2s;
    }
    .replay-back-btn:hover { background: rgba(255,255,255,0.06); color: var(--rt-text-primary); }
    .replay-title-bar {
      font-size: 15px; font-weight: 600; color: var(--rt-text-primary);
      display: flex; align-items: center; gap: 8px;
    }

    /* Timeline strip */
    .timeline-strip {
      display: flex; align-items: center;
      height: 32px; padding: 0 16px;
      background: rgba(255, 255, 255, 0.03);
      overflow-x: auto; gap: 0;
      -webkit-overflow-scrolling: touch; flex-shrink: 0;
    }
    .timeline-node {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--rt-border); transition: all 0.3s ease;
      cursor: pointer; flex-shrink: 0;
    }
    .timeline-node.round-marker {
      width: 10px; height: 10px;
      background: var(--rt-replay-accent);
    }
    .timeline-node.played { background: var(--rt-replay-accent); }
    .timeline-node.current {
      width: 7px; height: 7px;
      background: var(--rt-replay-accent);
      box-shadow: 0 0 8px var(--rt-replay-accent-glow);
    }
    .timeline-connector {
      flex: 1; min-width: 12px; height: 1px;
      background: var(--rt-border);
    }

    /* Replay speech area */
    .replay-speeches {
      flex: 1; overflow-y: auto; padding: 16px 0;
      padding-bottom: calc(var(--rt-control-height) + 16px);
    }
    .replay-speeches .speech-card {
      border-left: 3px solid var(--rt-replay-accent);
      opacity: 0.6; transition: opacity 0.5s;
    }
    .replay-speeches .speech-card.replay-active {
      opacity: 1;
      box-shadow: -4px 0 16px var(--rt-replay-accent-glow), var(--rt-shadow-sm);
    }
    .replay-speeches .speech-card.replay-past {
      opacity: 0.5;
    }

    /* Control bar */
    .replay-control-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--rt-control-height);
      background: var(--rt-control-bg);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--rt-control-border);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
      padding: 12px 20px; z-index: 200;
      display: flex; flex-direction: column; gap: 6px;
    }

    /* Progress bar */
    .replay-progress-track {
      width: 100%; height: 4px;
      background: var(--rt-replay-progress-track);
      border-radius: 999px; position: relative;
      cursor: pointer; transition: height 0.2s ease;
    }
    .replay-progress-track:hover,
    .replay-progress-track.dragging { height: 6px; }
    .replay-progress-fill {
      height: 100%; background: var(--rt-replay-accent);
      border-radius: 999px; transition: width 0.1s linear;
    }
    .replay-progress-handle {
      position: absolute; top: 50%;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--rt-replay-accent); border: 2px solid #fff;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s;
    }
    .replay-progress-track:hover .replay-progress-handle {
      width: 16px; height: 16px;
      box-shadow: 0 0 10px var(--rt-replay-accent-glow);
    }
    .replay-segment-marker {
      position: absolute; top: 0; width: 2px; height: 100%;
      background: rgba(255, 255, 255, 0.15); pointer-events: none;
    }

    /* Controls row */
    .replay-controls-row {
      display: flex; align-items: center;
      justify-content: space-between;
    }
    .replay-play-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--rt-replay-accent); border: none;
      color: #fff; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .replay-play-btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 12px var(--rt-replay-accent-glow);
    }
    .replay-time-info {
      display: flex; align-items: center; gap: 16px;
      font-size: 13px; color: var(--rt-text-muted);
    }
    .replay-speed-selector {
      display: inline-flex; border-radius: 6px;
      background: rgba(255, 255, 255, 0.06); overflow: hidden;
    }
    .replay-speed-btn {
      padding: 4px 10px; font-size: 12px;
      color: var(--rt-text-muted); border: none;
      background: transparent; cursor: pointer;
      transition: all 0.2s;
    }
    .replay-speed-btn.active {
      background: var(--rt-replay-accent); color: #fff;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container flex items-center justify-between py-3">
      <div class="flex items-center gap-2">
        <span class="status-badge waiting" id="statusBadge">
          <span class="badge-dot"></span>
          <span id="statusLabel">等待中</span>
        </span>
        <h1 class="text-lg font-semibold" style="color:var(--rt-text-primary)" id="topicTitle">圆桌讨论</h1>
      </div>
      <div class="flex items-center gap-3">
        <!-- Share button (desktop) -->
        <div class="relative" id="shareContainer">
          <button class="share-btn" id="shareBtn" aria-label="分享链接">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
            <span>分享</span>
          </button>
          <!-- Desktop Popover -->
          <div class="share-popover" id="sharePopover">
            <div class="share-popover-title">📋 分享链接</div>
            <div id="sharePanelContent">
              <div class="share-link-row">
                <input class="share-link-input" id="shareLinkInput" readonly>
                <button class="copy-btn" id="copyBtn">复制</button>
              </div>
              <div class="share-hint">任何人通过此链接可查看讨论</div>
              <button class="revoke-link-btn" id="revokeLinkBtn">⚠️ 撤销链接</button>
            </div>
            <div class="share-revoked-state hidden" id="shareRevokedState">
              <div class="revoked-icon">🔒</div>
              <div>链接已撤销</div>
            </div>
          </div>
        </div>
        <div class="conn-status">
          <span class="conn-dot connected" id="connDot"></span>
          <span id="connText">已连接</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="container py-4" id="mainContent">
    <!-- Waiting state -->
    <div id="waitingState" class="flex flex-col items-center justify-center py-20">
      <div class="spinner mb-4"></div>
      <p class="text-lg" style="color: var(--rt-text-secondary)">讨论即将开始…</p>
      <p class="text-sm mt-2" style="color: var(--rt-text-muted)">发言将会实时显示在这里</p>
    </div>

    <!-- Active state (hidden initially) -->
    <div id="activeState" class="hidden">
      <!-- Participants bar -->
      <div id="participantsBar" class="flex gap-2 mb-4 overflow-x-auto pb-2"></div>

      <!-- Speeches container -->
      <div id="speechesContainer"></div>

      <!-- Conclusion card (hidden until concluded) -->
      <div id="conclusionCard" class="hidden conclusion-card mt-6">
        <h3 class="text-lg font-semibold mb-2" style="position:relative;z-index:1;color:var(--rt-text-primary)">📌 讨论结论</h3>
        <div id="conclusionContent" class="leading-relaxed" style="position:relative;z-index:1;color:var(--rt-text-secondary)"></div>
      </div>

      <!-- Replay entry card (hidden until concluded) -->
      <div id="replayEntry" class="hidden replay-entry" onclick="enterReplayMode()">
        <div class="replay-entry-icon">🎬</div>
        <div class="replay-entry-title">回放讨论全过程</div>
        <div class="replay-entry-meta" id="replayEntryMeta">加载中…</div>
        <div class="replay-entry-agents" id="replayEntryAgents"></div>
      </div>
    </div>

    <!-- Revoked state (hidden) — updated to dark theme per design spec -->
    <div id="revokedState" class="revoked-page hidden">
      <div class="revoked-icon-lg">🔒</div>
      <h2 class="revoked-title">此讨论链接已失效</h2>
      <p class="revoked-desc">创作者已撤销了此链接的访问权限</p>
      <p class="revoked-brand">Roundtable AI · 圆桌讨论</p>
    </div>
  </main>

  <!-- ↓ 新消息 浮动按钮 -->
  <button class="scroll-bottom-btn hidden" id="scrollBottomBtn">
    <span>↓</span> <span>新消息</span>
  </button>

  <!-- Mobile Share Bar -->
  <div class="mobile-share-bar" id="mobileShareBar">
    <button class="share-btn" id="mobileShareBtn" aria-label="分享链接">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
      </svg>
      <span>分享讨论</span>
    </button>
  </div>

  <!-- Mobile Bottom Sheet -->
  <div class="share-sheet-overlay" id="shareSheetOverlay"></div>
  <div class="share-sheet" id="shareSheet">
    <div class="share-sheet-handle"></div>
    <div class="share-popover-title">📋 分享链接</div>
    <div id="shareSheetContent">
      <input class="share-link-input" id="shareSheetLinkInput" readonly style="width:100%;margin-bottom:12px">
      <button class="copy-btn" id="sheetCopyBtn" style="width:100%;padding:12px;font-size:var(--rt-font-size-base);margin-bottom:12px">复制链接</button>
      <div class="share-hint">任何人通过此链接可查看讨论</div>
      <button class="revoke-link-btn" id="sheetRevokeLinkBtn" style="justify-content:center;padding-top:16px">⚠️ 撤销链接</button>
    </div>
    <div class="share-revoked-state hidden" id="sheetRevokedState">
      <div class="revoked-icon">🔒</div>
      <div>链接已撤销</div>
    </div>
  </div>

  <!-- Revoke Confirmation Modal -->
  <div class="revoke-modal-overlay" id="revokeModalOverlay" role="dialog" aria-modal="true" aria-label="确认撤销链接">
    <div class="revoke-modal">
      <div class="revoke-modal-icon">⚠️</div>
      <div class="revoke-modal-title">确认撤销链接？</div>
      <div class="revoke-modal-desc">撤销后，所有通过此链接的访问将在 5 秒内失效，且不可恢复。</div>
      <div class="revoke-modal-actions">
        <button class="revoke-cancel-btn" id="revokeCancelBtn">取消</button>
        <button class="revoke-confirm-btn" id="revokeConfirmBtn">确认撤销</button>
      </div>
    </div>
  </div>

  <!-- Replay View (full-page overlay, hidden by default) -->
  <div id="replayView" class="hidden">
    <!-- Top bar -->
    <div class="replay-top-bar">
      <button class="replay-back-btn" onclick="exitReplayMode()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        返回
      </button>
      <div class="replay-title-bar">
        🎬 <span id="replayTopicTitle">回放</span>
      </div>
      <div class="replay-speed-selector" id="replaySpeedSelector">
        <button class="replay-speed-btn active" data-speed="1">1x</button>
        <button class="replay-speed-btn" data-speed="2">2x</button>
        <button class="replay-speed-btn" data-speed="4">4x</button>
      </div>
    </div>

    <!-- Timeline strip -->
    <div class="timeline-strip" id="timelineStrip"></div>

    <!-- Speeches container -->
    <div class="replay-speeches" id="replaySpeeches"></div>

    <!-- Control bar -->
    <div class="replay-control-bar">
      <div class="replay-progress-track" id="replayProgressTrack">
        <div class="replay-progress-fill" id="replayProgressFill" style="width:0%"></div>
        <div class="replay-progress-handle" id="replayProgressHandle" style="left:0%"></div>
      </div>
      <div class="replay-controls-row">
        <button class="replay-play-btn" id="replayPlayBtn">▶</button>
        <div class="replay-time-info">
          <span id="replayCurrentTime">00:00</span>
          <span>/</span>
          <span id="replayTotalTime">00:00</span>
          <span id="replayRoundInfo"></span>
        </div>
        <div class="replay-speed-selector" id="replaySpeedSelectorBottom">
          <button class="replay-speed-btn active" data-speed="1">1x</button>
          <button class="replay-speed-btn" data-speed="2">2x</button>
          <button class="replay-speed-btn" data-speed="4">4x</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Config injected by server
    const CONFIG = window.__RT_CONFIG__ || { token: '', port: 8199, host: '0.0.0.0' };
    const API_BASE = '';

    // State
    let state = {
      status: 'waiting',
      speeches: [],
      participants: [],
      topic: '',
      conclusion: null,
      currentRound: 0,
      speechIdSet: new Set(),
      roundSummaries: [],
      roundSummarySet: new Set(),
      streamSpeechMap: new Map(),
    };

    // Token batching buffer (rAF-based)
    let tokenBuffer = [];
    let rafId = null;

    // Auto-scroll state
    let autoScrollEnabled = true;
    const SCROLL_THRESHOLD = 50;


    // DOM refs
    const $statusBadge = document.getElementById('statusBadge');
    const $statusLabel = document.getElementById('statusLabel');
    const $topicTitle = document.getElementById('topicTitle');
    const $connDot = document.getElementById('connDot');
    const $connText = document.getElementById('connText');
    const $waitingState = document.getElementById('waitingState');
    const $activeState = document.getElementById('activeState');
    const $speechesContainer = document.getElementById('speechesContainer');
    const $participantsBar = document.getElementById('participantsBar');
    const $conclusionCard = document.getElementById('conclusionCard');
    const $conclusionContent = document.getElementById('conclusionContent');
    const $revokedState = document.getElementById('revokedState');
    const $scrollBottomBtn = document.getElementById('scrollBottomBtn');

    // ---- Auto-scroll logic ----
    const mainEl = document.querySelector('main');

    mainEl?.addEventListener('scroll', () => {
      const distanceFromBottom = mainEl.scrollHeight - mainEl.scrollTop - mainEl.clientHeight;
      autoScrollEnabled = distanceFromBottom < SCROLL_THRESHOLD;
      if ($scrollBottomBtn) {
        $scrollBottomBtn.classList.toggle('hidden', autoScrollEnabled);
      }
    });

    $scrollBottomBtn?.addEventListener('click', () => {
      mainEl?.scrollTo({ top: mainEl.scrollHeight, behavior: 'smooth' });
      autoScrollEnabled = true;
      $scrollBottomBtn.classList.add('hidden');
    });

    function scrollToEnd() {
      if (autoScrollEnabled && mainEl) {
        mainEl.scrollTop = mainEl.scrollHeight;
      }
    }

    // ---- SSE Connection ----
    let eventSource = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_DELAY = 30000;

    function connectSSE() {
      const url = `${API_BASE}/api/${CONFIG.token}/events`;

      if (typeof EventSource !== 'undefined') {
        // SSE (primary)
        eventSource = new EventSource(url);

        eventSource.addEventListener('init', (e) => {
          const data = JSON.parse(e.data);
          handleData(data);
          setConnection('connected');
          reconnectAttempts = 0;
        });

        eventSource.addEventListener('update', (e) => {
          const data = JSON.parse(e.data);
          handleData(data);
        });

        eventSource.addEventListener('delta', (e) => {
          const data = JSON.parse(e.data);
          handleDelta(data);
        });

        eventSource.addEventListener('revoked', () => {
          showRevoked();
        });

        eventSource.onerror = () => {
          setConnection('reconnecting');
          eventSource.close();
          reconnectAttempts++;
          const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), MAX_RECONNECT_DELAY);
          setTimeout(connectSSE, delay);
        };
      } else {
        // Long-polling fallback (WeChat)
        startLongPolling();
      }
    }

    function startLongPolling() {
      let since = 0;

      async function poll() {
        try {
          const resp = await fetch(`${API_BASE}/api/${CONFIG.token}/poll?since=${since}`);
          if (resp.status === 403) { showRevoked(); return; }
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

          const data = await resp.json();
          if (data.updated_at > since) {
            since = data.updated_at;
            handleData(data);
          }
          setConnection('connected');
        } catch (err) {
          setConnection('disconnected');
          await new Promise(r => setTimeout(r, 3000));
        }

        poll(); // continue polling
      }

      poll();
    }

    // ---- Data handling ----
    function handleDelta(data) {
      const events = Array.isArray(data?.events) ? data.events : [];
      for (const eventData of events) {
        applyStreamEvent(eventData);
      }
      if (events.length > 0) {
        $waitingState.classList.add('hidden');
        $activeState.classList.remove('hidden');
      }
    }

    function applyStreamEvent(eventData) {
      if (!eventData || !eventData.type) return;
      if (eventData.type === 'speech_start') {
        renderStreamingSpeechStart(eventData);
      } else if (eventData.type === 'speech_token') {
        appendStreamingSpeechToken(eventData);
      } else if (eventData.type === 'speech_end') {
        markStreamingSpeechEnd(eventData);
      } else if (eventData.type === 'speech_delta') {
        const speech = eventData.speech || eventData.payload?.speech;
        if (speech) mergeSpeech(speech, true);
      } else if (eventData.type === 'status_delta') {
        if (eventData.status || eventData.payload?.status) {
          state.status = eventData.status || eventData.payload.status;
          updateStatusUI();
        }
        const conclusion = eventData.conclusion || eventData.payload?.conclusion;
        if (conclusion && !state.conclusion) {
          state.conclusion = conclusion;
          renderConclusion(conclusion);
        }
      } else if (eventData.type === 'round_summary') {
        renderRoundSummary(eventData);
      } else if (eventData.type === 'final_summary') {
        renderFinalSummary(eventData);
      }
    }

    function handleData(data) {
      if (data.status === 'revoked' || (data.revoked_tokens && data.revoked_tokens.includes(CONFIG.token))) {
        showRevoked();
        return;
      }

      // Update topic
      if (data.topic && data.topic !== state.topic) {
        state.topic = data.topic;
        $topicTitle.textContent = data.topic;
        document.title = `${data.topic} — 圆桌讨论`;
      }

      // Update participants
      if (data.participants) {
        state.participants = data.participants;
        renderParticipants();
      }

      // Update speeches
      if (data.speeches) {
        const isInitialLoad = state.speeches.length === 0;
        for (const speech of data.speeches) {
          mergeSpeech(speech, !isInitialLoad);
        }

        // If it was the initial load, collapse older rounds
        if (isInitialLoad && state.speeches.length > 0) {
          const rounds = [...new Set(state.speeches.map(s => s.round))].sort((a, b) => a - b);
          if (rounds.length > 1) {
            const latestRound = rounds[rounds.length - 1];
            for (const r of rounds) {
              if (r !== latestRound) {
                const section = document.getElementById(`round-section-${r}`);
                if (section) {
                  section.classList.add('collapsed');
                }
              }
            }
          }
        }
      }

      // Update status
      if (data.status !== state.status) {
        state.status = data.status;
        updateStatusUI();
      }

      // Conclusion
      if (data.conclusion && !state.conclusion) {
        state.conclusion = data.conclusion;
        renderConclusion(data.conclusion);
      }

      // Round summaries / viewpoint cards
      if (Array.isArray(data.round_summaries)) {
        for (const summary of data.round_summaries) {
          renderRoundSummary(summary);
        }
      }

      if (data.final_summary) {
        renderFinalSummary(data.final_summary);
      }

      // Show active state if we have speeches or viewpoint cards
      if ((state.speeches.length > 0 || state.roundSummaries.length > 0) && state.status !== 'waiting') {
        $waitingState.classList.add('hidden');
        $activeState.classList.remove('hidden');
      }
    }

    // ---- Helper functions for role styles and aggregation ----
    function getRoleType(roleStr) {
      if (!roleStr) return 'default';
      const r = roleStr.toLowerCase();
      if (r.includes('product') || r.includes('pm') || r.includes('director') || r.includes('经理') || r.includes('总监')) return 'product';
      if (r.includes('design') || r.includes('ui') || r.includes('ux') || r.includes('设计')) return 'design';
      if (r.includes('engineer') || r.includes('dev') || r.includes('coder') || r.includes('tech') || r.includes('开发') || r.includes('工程') || r.includes('技术')) return 'engineer';
      if (r.includes('research') || r.includes('science') || r.includes('sci') || r.includes('researcher') || r.includes('研究') || r.includes('分析')) return 'research';
      if (r.includes('marketing') || r.includes('sales') || r.includes('biz') || r.includes('运营') || r.includes('市场')) return 'marketing';
      return 'default';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[ch]);
    }

    function renderMarkdown(value) {
      const html = marked.parse(String(value ?? ''));
      if (window.DOMPurify) {
        return DOMPurify.sanitize(html);
      }
      const template = document.createElement('template');
      template.innerHTML = html;
      template.content.querySelectorAll('script, iframe, object, embed, link, meta').forEach(el => el.remove());
      template.content.querySelectorAll('*').forEach(el => {
        for (const attr of [...el.attributes]) {
          if (/^on/i.test(attr.name) || /javascript:/i.test(attr.value)) {
            el.removeAttribute(attr.name);
          }
        }
      });
      return template.innerHTML;
    }

    window.toggleRound = function(roundNum) {
      const section = document.getElementById(`round-section-${roundNum}`);
      if (section) {
        section.classList.toggle('collapsed');
      }
    };

    function getOrCreateRoundSection(roundNum, isNew) {
      const id = `round-section-${roundNum}`;
      let section = document.getElementById(id);
      if (!section) {
        section = document.createElement('div');
        section.id = id;
        section.className = 'round-section';
        
        const titleText = roundNum === 0 ? '📢 开场发言 (Round 0)' : `💬 第 ${roundNum} 轮讨论 (Round ${roundNum})`;
        
        section.innerHTML = `
          <div class="round-header" onclick="toggleRound(${roundNum})">
            <div class="round-title">
              <span>${titleText}</span>
              <span class="round-badge-count" id="round-count-${roundNum}">0 条发言</span>
            </div>
            <svg class="toggle-icon" viewBox="0 0 24 24">
              <path d="M19 9l-7 7-7-7" />
            </svg>
          </div>
          <div class="round-body" id="round-body-${roundNum}"></div>
        `;
        
        // Collapse all previous rounds if it's dynamic update (isNew)
        if (isNew) {
          const existingSections = $speechesContainer.querySelectorAll('.round-section');
          existingSections.forEach(s => s.classList.add('collapsed'));
        }
        
        $speechesContainer.appendChild(section);
      }
      return section;
    }

    // ---- Rendering ----
    function renderParticipants() {
      $participantsBar.innerHTML = state.participants.map(p => `
        <div class="flex items-center gap-2 rounded-full px-3 py-1.5 text-sm whitespace-nowrap" style="background:var(--rt-bg-card);border:1px solid var(--rt-border)">
          <div class="avatar" style="width:24px;height:24px;font-size:11px">${escapeHtml((p.display_name || p.profile || '?')[0])}</div>
          <span class="font-medium" style="color:var(--rt-text-primary)">${escapeHtml(p.display_name || p.profile)}</span>
          ${p.role ? `<span class="text-xs" style="color:var(--rt-text-muted)">${escapeHtml(p.role)}</span>` : ''}
        </div>
      `).join('');
    }

    function participantMeta(agent) {
      const participantObj = state.participants.find(p => p.profile === agent || p.participant === agent);
      return {
        name: participantObj?.display_name || agent || 'Agent',
        role: participantObj?.role || '',
        roleType: agent === 'coordinator' ? 'coordinator' : getRoleType(participantObj?.role || ''),
      };
    }

    function updateRoundCount(roundNum) {
      const body = document.getElementById(`round-body-${roundNum}`);
      const countEl = document.getElementById(`round-count-${roundNum}`);
      if (body && countEl) {
        const count = body.querySelectorAll('.speech-card').length;
        countEl.textContent = `${count} 条发言`;
      }
    }

    function renderStreamingSpeechStart(eventData) {
      const id = eventData.id;
      if (!id || state.streamSpeechMap.has(id)) return;
      const agent = eventData.agent || eventData.participant || '';
      const meta = participantMeta(agent);
      const roundNum = Number(eventData.round || 0);
      const div = document.createElement('div');
      div.className = `speech-card role-${meta.roleType} new highlight streaming`;
      div.id = `speech-${id}`;

      const initial = escapeHtml((meta.name || agent || '?')[0]);
      const speakerName = escapeHtml(meta.name);
      const safeRoleName = escapeHtml(meta.role);
      const round = roundNum > 0 ? `<span class="round-badge" style="background: var(--rt-role-${meta.roleType}-bg); color: var(--rt-role-${meta.roleType})">R${roundNum}</span>` : '';
      div.innerHTML = `
        <div class="flex items-start gap-3">
          <div class="avatar" style="background: var(--rt-role-${meta.roleType}); color: var(--rt-text-inverse); box-shadow: 0 0 8px var(--rt-role-${meta.roleType}-bg)">${initial}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-2">
              <span class="font-semibold text-sm" style="color:var(--rt-text-primary)">${speakerName}</span>
              ${meta.role ? `<span class="text-xs px-2 py-0.5 rounded-full font-medium" style="background: var(--rt-role-${meta.roleType}-bg); color: var(--rt-role-${meta.roleType})">${safeRoleName}</span>` : ''}
              ${round}
              <span class="text-xs ml-auto" style="color:var(--rt-text-muted)">${formatTime(eventData.timestamp)}</span>
            </div>
            <div class="text-sm leading-relaxed markdown-content stream-content stream-cursor" style="color:var(--rt-text-secondary)"></div>
          </div>
        </div>
      `;
      getOrCreateRoundSection(roundNum, true);
      const body = document.getElementById(`round-body-${roundNum}`);
      body.appendChild(div);
      state.streamSpeechMap.set(id, { el: div, content: '', round: roundNum });
      updateRoundCount(roundNum);
      setTimeout(() => div.classList.remove('highlight'), 2000);
      scrollToEnd();
    }

    function appendStreamingSpeechToken(eventData) {
      tokenBuffer.push(eventData);
      if (!rafId) {
        rafId = requestAnimationFrame(flushTokenBuffer);
      }
    }

    function flushTokenBuffer() {
      rafId = null;
      const batch = tokenBuffer.splice(0);
      for (const eventData of batch) {
        const id = eventData.id;
        let entry = state.streamSpeechMap.get(id);
        if (!entry) {
          renderStreamingSpeechStart({ id, agent: eventData.agent || 'agent', round: eventData.round || state.currentRound || 0, timestamp: eventData.timestamp });
          entry = state.streamSpeechMap.get(id);
        }
        if (!entry) continue;
        entry.content += eventData.delta || '';
        const contentEl = entry.el.querySelector('.stream-content');
        if (contentEl) contentEl.innerHTML = renderMarkdown(entry.content);
      }
      scrollToEnd();
    }

    function markStreamingSpeechEnd(eventData) {
      const entry = state.streamSpeechMap.get(eventData.id);
      if (!entry) return;
      entry.el.classList.remove('streaming');
      const contentEl = entry.el.querySelector('.stream-content');
      if (contentEl) contentEl.classList.remove('stream-cursor');
      // 添加完成标记 ✓
      const headerEl = entry.el.querySelector('.flex.items-center');
      if (headerEl && !headerEl.querySelector('.speech-checkmark')) {
        const checkmark = document.createElement('span');
        checkmark.className = 'speech-checkmark';
        checkmark.textContent = '✓';
        checkmark.title = '发言完成';
        headerEl.appendChild(checkmark);
      }
    }

    function normalizeViewpointItems(items) {
      if (!Array.isArray(items)) return [];
      return items.map(item => typeof item === 'string' ? { content: item } : item).filter(Boolean);
    }

    function renderViewpointList(items, type) {
      const normalized = normalizeViewpointItems(items);
      if (normalized.length === 0) return '<li class="viewpoint-item">暂无</li>';
      return normalized.map(item => {
        const content = escapeHtml(item.content || item.text || item.title || String(item));
        const supporters = Array.isArray(item.supporters) && item.supporters.length > 0
          ? `<span class="viewpoint-supporters">支持：${escapeHtml(item.supporters.join('、'))}</span>`
          : '';
        return `<li class="viewpoint-item ${type}">${content}${supporters}</li>`;
      }).join('');
    }

    function renderRoundSummary(summary) {
      const roundNum = Number(summary.round || 0);
      const key = `round-${roundNum}`;
      state.roundSummarySet.add(key);
      state.roundSummaries = state.roundSummaries.filter(item => Number(item.round || 0) !== roundNum).concat(summary);
      getOrCreateRoundSection(roundNum, false);
      const body = document.getElementById(`round-body-${roundNum}`);
      let card = document.getElementById(`viewpoints-${key}`);
      if (!card) {
        card = document.createElement('div');
        card.id = `viewpoints-${key}`;
        card.className = 'viewpoints-card';
        body.appendChild(card);
      }
      const consensus = summary.consensus || summary.consensus_points || [];
      const disagreement = summary.disagreement || summary.disagreement_points || [];
      const score = summary.convergence_score;
      const hasScore = score !== undefined && score !== null;
      const scorePercent = hasScore ? Math.round(Number(score) * 100) : 0;
      card.innerHTML = `
        <div class="viewpoints-title" onclick="this.parentElement.classList.toggle('collapsed')">
          <span>🧠 第 ${roundNum} 轮观点汇总</span>
          <span style="display:flex;align-items:center;gap:6px">
            ${hasScore ? `<span class="round-badge-count">收敛度 ${scorePercent}%</span>` : ''}
            <span class="toggle-icon">▾</span>
          </span>
        </div>
        ${hasScore ? `
          <div class="convergence-bar">
            <div class="convergence-bar-fill" style="width: ${scorePercent}%">
            </div>
            <span class="convergence-label">${scorePercent}%</span>
          </div>
        ` : ''}
        <div class="mode-toggle">
          <button class="mode-toggle-btn active" onclick="this.parentElement.querySelector('.mode-toggle-btn.active')?.classList.remove('active');this.classList.add('active');this.closest('.viewpoints-card').querySelector('.viewpoints-body').dataset.mode='compact'">精简</button>
          <button class="mode-toggle-btn" onclick="this.parentElement.querySelector('.mode-toggle-btn.active')?.classList.remove('active');this.classList.add('active');this.closest('.viewpoints-card').querySelector('.viewpoints-body').dataset.mode='full'">全文</button>
        </div>
        <div class="viewpoints-body" data-mode="compact">
          <div class="viewpoints-grid">
            <div class="viewpoints-column">
              <h4>✅ 共识观点</h4>
              <ul>${renderViewpointList(consensus, 'consensus')}</ul>
            </div>
            <div class="viewpoints-column">
              <h4>⚡ 分歧观点</h4>
              <ul>${renderViewpointList(disagreement, 'disagreement')}</ul>
            </div>
          </div>
        </div>
      `;
      scrollToEnd();
    }

    function renderFinalSummary(summary) {
      if (!summary) return;
      const consensus = summary.consensus || summary.consensus_points || [];
      const disagreement = summary.disagreement || summary.disagreement_points || [];
      const verdict = summary.verdict ? `<div class="verdict-box"><span class="verdict-icon">📋</span><div><div style="font-weight:700;margin-bottom:8px;">结论</div><div class="markdown-content">${renderMarkdown(summary.verdict)}</div></div></div>` : '';
      $conclusionContent.innerHTML = `
        <div class="viewpoints-grid">
          <div class="viewpoints-column">
            <h4>✅ 最终共识</h4>
            <ul>${renderViewpointList(consensus, 'consensus')}</ul>
          </div>
          <div class="viewpoints-column">
            <h4>⚡ 保留分歧</h4>
            <ul>${renderViewpointList(disagreement, 'disagreement')}</ul>
          </div>
        </div>
        ${verdict}
      `;
      $conclusionCard.classList.remove('hidden');
      // 最终总结发光效果
      $conclusionCard.classList.add('final-summary-glow');
      scrollToEnd();
    }

    function mergeSpeech(speech, isNew = false) {
      if (!speech || speech.id === undefined || state.speechIdSet.has(speech.id)) return;
      state.speechIdSet.add(speech.id);
      state.speeches.push(speech);
      const streaming = state.streamSpeechMap.get(speech.id);
      if (streaming) {
        streaming.el.remove();
        state.streamSpeechMap.delete(speech.id);
      }
      renderSpeech(speech, isNew);
    }

    function renderSpeech(speech, isNew = false) {
      // Find role info
      let roleType = 'default';
      let roleName = '';
      if (speech.participant === 'coordinator') {
        roleType = 'coordinator';
        roleName = '👑 协调者';
      } else {
        const participantObj = state.participants.find(p => p.profile === speech.participant);
        if (participantObj) {
          roleType = getRoleType(participantObj.role);
          roleName = participantObj.role || '';
        }
      }

      const div = document.createElement('div');
      div.className = `speech-card role-${roleType}${isNew ? ' new highlight' : ''}`;
      div.id = `speech-${speech.id}`;

      const initial = escapeHtml((speech.display_name || speech.participant || '?')[0]);
      const speakerName = escapeHtml(speech.display_name || speech.participant);
      const safeRoleName = escapeHtml(roleName);
      const round = speech.round > 0 ? `<span class="round-badge" style="background: var(--rt-role-${roleType}-bg); color: var(--rt-role-${roleType})">R${speech.round}</span>` : '';

      div.innerHTML = `
        <div class="flex items-start gap-3">
          <div class="avatar" style="background: var(--rt-role-${roleType}); color: var(--rt-text-inverse); box-shadow: 0 0 8px var(--rt-role-${roleType}-bg)">${initial}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-2">
              <span class="font-semibold text-sm" style="color:var(--rt-text-primary)">${speakerName}</span>
              ${roleName ? `<span class="text-xs px-2 py-0.5 rounded-full font-medium" style="background: var(--rt-role-${roleType}-bg); color: var(--rt-role-${roleType})">${safeRoleName}</span>` : ''}
              ${round}
              <span class="text-xs ml-auto" style="color:var(--rt-text-muted)">${formatTime(speech.created_at)}</span>
            </div>
            <div class="text-sm leading-relaxed markdown-content" style="color:var(--rt-text-secondary)">${renderMarkdown(speech.content)}</div>
          </div>
        </div>
      `;

      // Get or create round section
      getOrCreateRoundSection(speech.round, isNew);
      const body = document.getElementById(`round-body-${speech.round}`);
      body.appendChild(div);

      // Update count
      const countEl = document.getElementById(`round-count-${speech.round}`);
      if (countEl) {
        const count = body.children.length;
        countEl.textContent = `${count} 条发言`;
      }

      // Remove highlight after 2s
      if (isNew) {
        setTimeout(() => div.classList.remove('highlight'), 2000);
        scrollToEnd();
      }
    }

    function renderConclusion(content) {
      $conclusionContent.innerHTML = `<div class="markdown-content">${renderMarkdown(content)}</div>`;
      $conclusionCard.classList.remove('hidden');
      setTimeout(() => {
        $conclusionCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 300);
      // Show replay entry when conclusion appears
      showReplayEntry();
    }

    function updateStatusUI() {
      const statusMap = {
        waiting: { cls: 'waiting', label: '等待中' },
        active:  { cls: 'live',    label: 'LIVE' },
        concluded: { cls: 'ended', label: '已结束' },
      };
      const info = statusMap[state.status] || statusMap.waiting;
      $statusBadge.className = `status-badge ${info.cls}`;
      $statusLabel.textContent = info.label;
      if (state.status === 'concluded') {
        $waitingState.classList.add('hidden');
        $activeState.classList.remove('hidden');
      }
    }

    function showRevoked() {
      $revokedState.classList.remove('hidden');
      if (eventSource) eventSource.close();
    }

    function setConnection(status) {
      $connDot.className = `conn-dot ${status}`;
      const labels = { connected: '已连接', disconnected: '已断开', reconnecting: '重连中…' };
      $connText.textContent = labels[status] || status;
    }

    // ---- Utils ----
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatTime(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
    }

    // ═══════════════════════════════════════
    // Share Interaction Logic
    // ═══════════════════════════════════════

    // DOM refs — Share
    const $shareContainer = document.getElementById('shareContainer');
    const $shareBtn = document.getElementById('shareBtn');
    const $sharePopover = document.getElementById('sharePopover');
    const $sharePanelContent = document.getElementById('sharePanelContent');
    const $shareLinkInput = document.getElementById('shareLinkInput');
    const $copyBtn = document.getElementById('copyBtn');
    const $revokeLinkBtn = document.getElementById('revokeLinkBtn');
    const $shareRevokedState = document.getElementById('shareRevokedState');
    const $mobileShareBtn = document.getElementById('mobileShareBtn');
    const $shareSheetOverlay = document.getElementById('shareSheetOverlay');
    const $shareSheet = document.getElementById('shareSheet');
    const $shareSheetContent = document.getElementById('shareSheetContent');
    const $shareSheetLinkInput = document.getElementById('shareSheetLinkInput');
    const $sheetCopyBtn = document.getElementById('sheetCopyBtn');
    const $sheetRevokeLinkBtn = document.getElementById('sheetRevokeLinkBtn');
    const $sheetRevokedState = document.getElementById('sheetRevokedState');
    const $revokeModalOverlay = document.getElementById('revokeModalOverlay');
    const $revokeCancelBtn = document.getElementById('revokeCancelBtn');
    const $revokeConfirmBtn = document.getElementById('revokeConfirmBtn');

    // State
    let shareLink = '';
    let popoverOpen = false;
    let sheetOpen = false;

    function isMobile() {
      return window.innerWidth < 768;
    }

    // ---- Share Button Click ----
    $shareBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (popoverOpen) {
        closePopover();
      } else {
        await openPopover();
      }
    });

    $mobileShareBtn.addEventListener('click', async () => {
      await openSheet();
    });

    // ---- Desktop Popover ----
    async function openPopover() {
      if (isMobile()) {
        await openSheet();
        return;
      }
      // Generate share link if not already set
      if (!shareLink) {
        await generateShareLink();
      }
      $sharePopover.classList.add('visible');
      popoverOpen = true;
    }

    function closePopover() {
      $sharePopover.classList.remove('visible');
      popoverOpen = false;
    }

    // Close popover on click outside
    document.addEventListener('click', (e) => {
      if (popoverOpen && !$shareContainer.contains(e.target)) {
        closePopover();
      }
    });

    // Close popover on ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (revokeModalOpen) {
          closeRevokeModal();
        } else if (sheetOpen) {
          closeSheet();
        } else if (popoverOpen) {
          closePopover();
        }
      }
    });

    // ---- Mobile Bottom Sheet ----
    async function openSheet() {
      if (!shareLink) {
        await generateShareLink();
      }
      $shareSheetOverlay.classList.add('visible');
      $shareSheet.classList.add('visible');
      sheetOpen = true;
    }

    function closeSheet() {
      $shareSheetOverlay.classList.remove('visible');
      $shareSheet.classList.remove('visible');
      sheetOpen = false;
    }

    $shareSheetOverlay.addEventListener('click', closeSheet);

    // ---- Generate Share Link ----
    async function generateShareLink() {
      try {
        const resp = await fetch(`${API_BASE}/api/${CONFIG.token}/share`, {
          method: 'POST',
        });
        if (resp.ok) {
          const data = await resp.json();
          // Build full URL from the relative share_url
          shareLink = `${location.origin}${data.share_url}`;
        } else {
          // Fallback: just use current URL
          shareLink = location.href;
        }
      } catch {
        shareLink = location.href;
      }

      // Update UI
      $shareLinkInput.value = shareLink;
      $shareSheetLinkInput.value = shareLink;
    }

    // ---- Copy to Clipboard ----
    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      // Fallback for WeChat / old browsers
      return new Promise((resolve, reject) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          resolve();
        } catch (err) {
          reject(err);
        } finally {
          document.body.removeChild(textarea);
        }
      });
    }

    function showCopySuccess(btn, originalText) {
      btn.textContent = '✓ 已复制';
      btn.classList.add('copied');
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = originalText;
        btn.classList.remove('copied');
        btn.disabled = false;
      }, 2000);
    }

    $copyBtn.addEventListener('click', async () => {
      if (!shareLink) return;
      try {
        await copyToClipboard(shareLink);
        showCopySuccess($copyBtn, '复制');
      } catch {
        // If clipboard fails, select the input so user can manually copy
        $shareLinkInput.select();
      }
    });

    $sheetCopyBtn.addEventListener('click', async () => {
      if (!shareLink) return;
      try {
        await copyToClipboard(shareLink);
        showCopySuccess($sheetCopyBtn, '复制链接');
      } catch {
        $shareSheetLinkInput.select();
      }
    });

    // ---- Revoke Confirmation Modal ----
    let revokeModalOpen = false;

    function openRevokeModal() {
      $revokeModalOverlay.classList.add('visible');
      revokeModalOpen = true;
    }

    function closeRevokeModal() {
      $revokeModalOverlay.classList.remove('visible');
      revokeModalOpen = false;
    }

    $revokeLinkBtn.addEventListener('click', () => {
      openRevokeModal();
    });

    $sheetRevokeLinkBtn.addEventListener('click', () => {
      openRevokeModal();
    });

    $revokeCancelBtn.addEventListener('click', closeRevokeModal);

    // Close modal on overlay click
    $revokeModalOverlay.addEventListener('click', (e) => {
      if (e.target === $revokeModalOverlay) {
        closeRevokeModal();
      }
    });

    // ---- Revoke Confirm ----
    $revokeConfirmBtn.addEventListener('click', async () => {
      $revokeConfirmBtn.disabled = true;
      $revokeConfirmBtn.textContent = '撤销中…';

      try {
        const resp = await fetch(`${API_BASE}/api/${CONFIG.token}/revoke`, {
          method: 'POST',
        });

        if (resp.ok) {
          closeRevokeModal();
          showRevokedInPanel();
          // The SSE 'revoked' event will show the full-page revoked state
        } else {
          alert('撤销失败，请重试');
          $revokeConfirmBtn.disabled = false;
          $revokeConfirmBtn.textContent = '确认撤销';
        }
      } catch {
        alert('网络错误，请重试');
        $revokeConfirmBtn.disabled = false;
        $revokeConfirmBtn.textContent = '确认撤销';
      }
    });

    function showRevokedInPanel() {
      // Desktop popover
      $sharePanelContent.classList.add('hidden');
      $shareRevokedState.classList.remove('hidden');
      // Mobile sheet
      $shareSheetContent.classList.add('hidden');
      $sheetRevokedState.classList.remove('hidden');
      // Auto-close panels after 3s
      setTimeout(() => {
        closePopover();
        closeSheet();
      }, 3000);
    }

    // ---- Init ----
    connectSSE();
  </script>
</body>
</html>
